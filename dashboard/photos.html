<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror Photos</title>
<style>
:root {
  --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424; --border:#333;
  --text:#e8e8e8; --text-dim:#777; --accent:#a855f7; --green:#22c55e;
  --red:#ef4444; --amber:#f59e0b; --radius:10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; }

header { padding:1.25rem 1.5rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
header h1 { font-size:1.1rem; font-weight:700; }
.back-link { font-size:.8rem; color:var(--text-dim); text-decoration:none; }
.back-link:hover { color:var(--accent); }

.nfc-banner { margin:1rem 1.5rem 0; padding:1rem 1.25rem; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.nfc-icon { font-size:1.8rem; flex-shrink:0; }
.nfc-info h3 { font-size:.85rem; font-weight:700; margin-bottom:.2rem; }
.nfc-info p  { font-size:.75rem; color:var(--text-dim); }
.nfc-url { font-family:monospace; font-size:.75rem; background:var(--surface2); padding:.2rem .5rem; border-radius:4px; color:var(--accent); word-break:break-all; }

.toolbar { padding:.75rem 1.5rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; border-bottom:1px solid var(--border); }
.toolbar label { font-size:.8rem; color:var(--text-dim); }
.toolbar select { background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.3rem .6rem; color:var(--text); font-size:.8rem; }
.btn { padding:.45rem .9rem; border:none; border-radius:6px; font-weight:600; font-size:.78rem; cursor:pointer; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover { border-color:var(--accent); color:var(--accent); }
.btn-accent { background:var(--accent); color:#fff; }
.btn-accent:hover { background:#7c3aed; }
.btn-amber { background:#2a2010; border:1px solid #4a3a10; color:var(--amber); font-size:.72rem; }
.btn-amber:hover { background:#3a2e14; }
.btn-dl    { background:#152a1e; border:1px solid #1f5a30; color:var(--green); font-size:.72rem; }
.btn-dl:hover    { background:#1e3a28; }

.photo-count { font-size:.8rem; color:var(--text-dim); margin-left:auto; }

.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1rem; padding:1rem 1.5rem; }

.photo-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.photo-thumb { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#000; }
.photo-info  { padding:.75rem; }
.photo-type  { font-size:.65rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); margin-bottom:.3rem; }
.photo-text  { font-size:.78rem; color:var(--text-dim); margin-bottom:.3rem; line-height:1.4; word-break:break-word; }
.photo-ts    { font-size:.68rem; color:#555; font-family:monospace; margin-bottom:.6rem; }
.photo-btns  { display:flex; gap:.4rem; flex-wrap:wrap; }

.empty { text-align:center; padding:4rem 1.5rem; color:var(--text-dim); }
.empty p { margin-top:.5rem; font-size:.85rem; }

.toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.6rem 1rem; font-size:.82rem; opacity:0; transition:.2s; pointer-events:none; }
.toast.show { opacity:1; }
.toast.ok    { border-color:var(--green); color:var(--green); }
.toast.error { border-color:var(--red);   color:var(--red); }
</style>
</head>
<body>

<header>
  <h1>📸 Photos</h1>
  <a class="back-link" href="/" id="back-link">← Control Panel</a>
</header>

<div class="nfc-banner">
  <div class="nfc-icon">📲</div>
  <div class="nfc-info">
    <h3>NFC Tag</h3>
    <p>Program your NFC tag with this URL so flatmates can tap to see photos:</p>
    <div class="nfc-url" id="nfc-url">loading…</div>
  </div>
</div>

<div class="toolbar">
  <label>Show last</label>
  <select id="hours-select">
    <option value="6">6 hours</option>
    <option value="24" selected>24 hours</option>
    <option value="72">3 days</option>
    <option value="168">7 days</option>
  </select>
  <button class="btn btn-outline" id="btn-refresh">↻ Refresh</button>
  <span class="photo-count" id="photo-count"></span>
</div>

<div class="grid" id="grid">
  <div class="empty"><div style="font-size:2rem">⌛</div><p>Loading photos…</p></div>
</div>

<div class="toast" id="toast"></div>

<script>
function apiBase() {
  // If served from the Pi directly, use same origin.
  if (location.hostname !== 'fionnf.github.io' && !location.hostname.includes('github.io')) {
    return location.protocol + '//' + location.host;
  }
  // GitHub Pages fallback — use saved IP
  const saved = localStorage.getItem('mirror-ip');
  if (!saved) return null;
  let ip = saved.trim();
  if (!ip.includes(':')) ip += ':5000';
  return ip.startsWith('http') ? ip : 'http://' + ip;
}

function setNfcUrl() {
  const base = apiBase();
  const url  = base ? base + '/gallery' : window.location.href;
  document.getElementById('nfc-url').textContent = url;
  document.getElementById('back-link').href = base ? base + '/' : '/';
}

async function loadPhotos() {
  const hours = document.getElementById('hours-select').value;
  const base  = apiBase();
  if (!base) {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><div style="font-size:2rem">⚙️</div><p>Configure mirror IP in the control panel first.</p></div>';
    return;
  }
  try {
    const r = await fetch(`${base}/api/photos?hours=${hours}`, {signal: AbortSignal.timeout(5000)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const photos = await r.json();
    renderPhotos(photos, base);
    document.getElementById('photo-count').textContent = photos.length + ' photo' + (photos.length !== 1 ? 's' : '');
  } catch(e) {
    document.getElementById('grid').innerHTML =
      `<div class="empty"><div style="font-size:2rem">⚠️</div><p>Could not load photos: ${e.message}</p></div>`;
  }
}

function renderPhotos(photos, base) {
  const grid = document.getElementById('grid');
  if (!photos.length) {
    grid.innerHTML = '<div class="empty"><div style="font-size:2rem">📭</div><p>No photos in this time window yet.</p></div>';
    return;
  }
  grid.innerHTML = photos.map(p => {
    const src    = base + p.url;
    const label  = p.type === 'strip' ? 'Photobooth' : 'Receipt';
    const tsStr  = new Date(p.ts).toLocaleString();
    const caption = p.type === 'strip'
      ? (p.prompts || []).join(' · ') || ''
      : p.text || '';
    return `
      <div class="photo-card">
        <img class="photo-thumb" src="${src}" alt="${label}" loading="lazy">
        <div class="photo-info">
          <div class="photo-type">${label}</div>
          ${caption ? `<div class="photo-text">${escHtml(caption)}</div>` : ''}
          <div class="photo-ts">${tsStr}</div>
          <div class="photo-btns">
            <a class="btn btn-dl" href="${src}" download="${p.id}.jpg">⬇ Download</a>
            <button class="btn btn-amber" onclick="reprint('${p.id}')">🖨 Reprint</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

async function reprint(id) {
  const base = apiBase();
  if (!base) return;
  try {
    const r = await fetch(`${base}/api/photos/${id}/reprint`, {
      method: 'POST',
      signal: AbortSignal.timeout(8000)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    toast('Sent to printer ✓', 'ok');
  } catch(e) {
    toast('Reprint failed: ' + e.message, 'error');
  }
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  setTimeout(() => el.className = 'toast', 3000);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('hours-select').addEventListener('change', loadPhotos);
document.getElementById('btn-refresh').addEventListener('click', loadPhotos);

setNfcUrl();
loadPhotos();
</script>
</body>
</html>
