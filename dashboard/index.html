<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Mirror Control</title>
<script src="https://unpkg.com/mqtt@5.3.4/dist/mqtt.min.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #333;
  --text: #e8e8e8;
  --text-dim: #888;
  --accent: #a855f7;
  --accent2: #7c3aed;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; min-height:100vh; }

header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10; }
h1 { font-size:1.1rem; font-weight:700; letter-spacing:.02em; }
.badges { display:flex; gap:.5rem; align-items:center; }
.badge { display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .7rem; border-radius:20px; font-size:.75rem; font-weight:600; }
.badge-offline { background:#2a1515; color:var(--red); }
.badge-online  { background:#152a1e; color:var(--green); }
.badge-mqtt    { background:#1e1528; color:var(--accent); }
.badge-http    { background:#282015; color:var(--amber); }
.badge-state   { background:var(--surface2); color:var(--text-dim); font-family:monospace; }
.dot { width:6px; height:6px; border-radius:50%; background:currentColor; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

.main { display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding:1rem 1.5rem; max-width:1100px; margin:0 auto; }
@media(max-width:700px){ .main{grid-template-columns:1fr} }

.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.25rem; }
.card h2 { font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:1rem; }
.full-width { grid-column:1/-1; }

/* config bar */
.config-bar { padding:.75rem 1.5rem; border-bottom:1px solid var(--border); display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
.config-bar label { font-size:.8rem; color:var(--text-dim); white-space:nowrap; }
.config-bar input { flex:1; min-width:160px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:.4rem .7rem; color:var(--text); font-size:.85rem; }
.config-bar input:focus { outline:none; border-color:var(--accent); }
.note { font-size:.72rem; color:var(--text-dim); }

/* preview */
.preview-wrap { background:#000; border-radius:6px; overflow:hidden; position:relative; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; margin-bottom:.75rem; }
.preview-wrap img { width:100%; height:100%; object-fit:contain; display:none; }
.preview-placeholder { color:var(--text-dim); font-size:.8rem; }
.preview-ts { position:absolute; bottom:4px; right:6px; font-size:.65rem; color:#666; font-family:monospace; }

/* controls */
.btn-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
.btn { padding:.6rem .9rem; border:none; border-radius:6px; font-weight:600; font-size:.8rem; cursor:pointer; transition:.15s; }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn-accent  { background:var(--accent); color:#fff; }
.btn-accent:hover:not(:disabled)  { background:var(--accent2); }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-outline:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.btn-danger  { background:#3a1515; border:1px solid #5a2020; color:var(--red); }
.btn-danger:hover:not(:disabled)  { background:#4a1e1e; }
.btn-success { background:#153a20; border:1px solid #1f5a30; color:var(--green); }
.btn-success:hover:not(:disabled) { background:#1e4a28; }
.btn-full { grid-column:1/-1; }
.btn-amber  { background:#2a2010; border:1px solid #4a3a10; color:var(--amber); }
.btn-amber:hover:not(:disabled)  { background:#3a2e14; }

/* textarea / inputs */
textarea, input[type=text], input[type=number] {
  width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:6px;
  padding:.5rem .75rem; color:var(--text); font-size:.82rem; font-family:inherit; resize:vertical;
}
textarea:focus, input:focus { outline:none; border-color:var(--accent); }
label.field-label { display:block; font-size:.75rem; color:var(--text-dim); margin-bottom:.3rem; margin-top:.75rem; }
label.field-label:first-child { margin-top:0; }

.row { display:flex; gap:.5rem; align-items:flex-end; }
.row > * { flex:1; }
.row > .btn { flex:0 0 auto; }

/* prompt section */
.prompt-restore { font-size:.7rem; color:var(--text-dim); cursor:pointer; text-decoration:underline; float:right; margin-top:.3rem; }
.prompt-restore:hover { color:var(--accent); }
.divider { border:none; border-top:1px solid var(--border); margin:1rem 0; }

/* gallery link */
.gallery-link { display:flex; align-items:center; justify-content:space-between; padding:.75rem; background:var(--surface2); border-radius:6px; text-decoration:none; color:var(--text); font-size:.85rem; margin-top:.75rem; border:1px solid var(--border); }
.gallery-link:hover { border-color:var(--accent); color:var(--accent); }

.status-msg { font-size:.75rem; color:var(--text-dim); margin-top:.5rem; min-height:1rem; }
.status-msg.error { color:var(--red); }
.status-msg.ok { color:var(--green); }

/* image upload preview */
#img-preview { width:100%; max-height:120px; object-fit:contain; border-radius:6px; background:#000; display:none; margin-top:.5rem; }
</style>
</head>
<body>

<header>
  <h1>✦ Magic Mirror</h1>
  <div class="badges">
    <span class="badge badge-state" id="state-badge">—</span>
    <span class="badge badge-offline" id="conn-badge"><span class="dot"></span><span id="conn-text">Offline</span></span>
    <span class="badge badge-http" id="transport-badge">HTTP</span>
  </div>
</header>

<div class="config-bar">
  <label>Mirror IP</label>
  <input id="mirror-ip" type="text" placeholder="192.168.1.100" value="localhost">
  <span class="note">Access via <code>http://&lt;ip&gt;:5000</code> on local network for MQTT to work</span>
</div>

<div class="main">

  <!-- LEFT: Preview + Controls -->
  <div>
    <div class="card" style="margin-bottom:1rem">
      <h2>Live Preview</h2>
      <div class="preview-wrap" id="preview-wrap">
        <img id="live-preview" alt="Live preview">
        <span class="preview-placeholder" id="preview-placeholder">No signal</span>
        <span class="preview-ts" id="preview-ts"></span>
      </div>
      <span class="status-msg" id="preview-msg"></span>
    </div>

    <div class="card">
      <h2>Controls</h2>
      <div class="btn-grid">
        <button class="btn btn-accent" id="btn-trigger" disabled>▶ Trigger</button>
        <button class="btn btn-outline" id="btn-booth" disabled>📷 Photobooth</button>
        <button class="btn btn-success" id="btn-power-on" disabled>Power On</button>
        <button class="btn btn-danger" id="btn-power-off" disabled>Power Off</button>
      </div>
      <a class="gallery-link" id="gallery-link" href="/gallery">📸 Photo Gallery →</a>
    </div>
  </div>

  <!-- RIGHT: Push content + Prompts -->
  <div>
    <div class="card" style="margin-bottom:1rem">
      <h2>Push to Mirror</h2>

      <label class="field-label">Overlay Text</label>
      <div class="row">
        <textarea id="overlay-text" rows="2" placeholder="Text to show on mirror during idle…"></textarea>
      </div>
      <div class="btn-grid" style="margin-top:.5rem">
        <button class="btn btn-outline" id="btn-send-text" disabled>Send Text</button>
        <button class="btn btn-amber"   id="btn-clear-overlay" disabled>✕ Clear</button>
      </div>

      <hr class="divider">

      <label class="field-label">Overlay Image</label>
      <input type="file" id="img-file" accept="image/*" style="width:100%;font-size:.8rem;color:var(--text-dim)">
      <img id="img-preview">
      <button class="btn btn-outline btn-full" id="btn-send-image" disabled style="margin-top:.5rem">Send Image</button>
      <span class="status-msg" id="push-msg"></span>
    </div>

    <div class="card">
      <h2>Prompts <span style="font-weight:400;font-size:.7rem;color:var(--text-dim)">(saved live to mirror — originals in localStorage)</span></h2>

      <label class="field-label">Mirror Persona
        <span class="prompt-restore" onclick="restorePrompt('MIRROR_PERSONA')">restore original</span>
      </label>
      <textarea id="prompt-persona" rows="4"></textarea>

      <label class="field-label">Fallback Message
        <span class="prompt-restore" onclick="restorePrompt('AI_FALLBACK_MESSAGE')">restore original</span>
      </label>
      <input type="text" id="prompt-fallback">

      <label class="field-label">Booth Prompt System
        <span class="prompt-restore" onclick="restorePrompt('BOOTH_AI_PROMPT_SYSTEM')">restore original</span>
      </label>
      <textarea id="prompt-booth" rows="4"></textarea>

      <div class="btn-grid" style="margin-top:.75rem">
        <button class="btn btn-accent btn-full" id="btn-save-prompts" disabled>Save Prompts</button>
      </div>
      <span class="status-msg" id="prompts-msg"></span>
    </div>

    <div class="card" style="margin-top:1rem">
      <h2>Settings</h2>
      <label class="field-label">Scroll Speed (px/s)</label>
      <div class="row">
        <input type="number" id="scroll-speed" min="10" max="200" value="40" disabled>
        <button class="btn btn-outline" id="btn-save-settings" disabled>Save</button>
      </div>
    </div>
  </div>

</div><!-- /main -->

<script>
const POLL_INTERVAL   = 2500;
const SNAPSHOT_INTERVAL = 1000;
const API_TIMEOUT     = 5000;

let mirrorOnline  = false;
let mqttClient    = null;
let mqttConnected = false;
let pollTimer     = null;
let snapTimer     = null;

// ---------------------------------------------------------------- DOM refs
const mirrorIpInput  = document.getElementById('mirror-ip');
const connBadge      = document.getElementById('conn-badge');
const connText       = document.getElementById('conn-text');
const stateBadge     = document.getElementById('state-badge');
const transportBadge = document.getElementById('transport-badge');
const livePreview    = document.getElementById('live-preview');
const previewPlaceholder = document.getElementById('preview-placeholder');
const previewTs      = document.getElementById('preview-ts');
const previewMsg     = document.getElementById('preview-msg');
const pushMsg        = document.getElementById('push-msg');
const promptsMsg     = document.getElementById('prompts-msg');
const galleryLink    = document.getElementById('gallery-link');

const allCtrlBtns = [
  'btn-trigger','btn-booth','btn-power-on','btn-power-off',
  'btn-send-text','btn-clear-overlay','btn-send-image',
  'btn-save-prompts','btn-save-settings',
].map(id => document.getElementById(id));
const scrollSpeedInput = document.getElementById('scroll-speed');

// ---------------------------------------------------------------- init
window.addEventListener('load', () => {
  const saved = localStorage.getItem('mirror-ip');
  if (saved) mirrorIpInput.value = saved;
  connect();
  loadPrompts();
  updateGalleryLink();
});

mirrorIpInput.addEventListener('change', () => {
  localStorage.setItem('mirror-ip', mirrorIpInput.value);
  reconnect();
  updateGalleryLink();
});

function updateGalleryLink() {
  const base = apiBase();
  if (base) {
    galleryLink.href = base + '/gallery';
  }
}

// ---------------------------------------------------------------- url helpers
function mirrorIp() {
  let v = mirrorIpInput.value.trim();
  if (!v) return null;
  if (!v.includes(':')) v += ':5000';
  return v;
}
function apiBase() {
  const ip = mirrorIp();
  if (!ip) return null;
  return ip.startsWith('http') ? ip : 'http://' + ip;
}

async function fetchApi(path, opts = {}) {
  const base = apiBase();
  if (!base) throw new Error('No IP configured');
  const ctrl = new AbortController();
  const t    = setTimeout(() => ctrl.abort(), API_TIMEOUT);
  try {
    const r = await fetch(base + path, { ...opts, signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  } catch(e) { clearTimeout(t); throw e; }
}

// ---------------------------------------------------------------- MQTT
function connect() {
  const ip = mirrorIp();
  if (!ip) return;
  clearTimers();

  // Try MQTT over WebSocket
  if (typeof mqtt !== 'undefined') {
    const host = ip.split(':')[0];
    const wsUrl = `ws://${host}:9001/mqtt`;
    try {
      if (mqttClient) { try { mqttClient.end(true); } catch(_){} }
      mqttClient = mqtt.connect(wsUrl, {
        clientId:        'dashboard-' + Math.random().toString(16).slice(2, 8),
        connectTimeout:  4000,
        reconnectPeriod: 0,  // manual reconnect via HTTP fallback
        clean:           true,
      });
      mqttClient.on('connect', onMqttConnect);
      mqttClient.on('error',   onMqttError);
      mqttClient.on('close',   onMqttClose);
      mqttClient.on('message', onMqttMessage);
    } catch(e) { startHttpPoll(); }
  } else {
    startHttpPoll();
  }
  // Fallback HTTP poll always runs in parallel as safety net
  startHttpPoll();
}

function reconnect() {
  if (mqttClient) { try { mqttClient.end(true); } catch(_){} mqttClient = null; }
  mqttConnected = false;
  connect();
}

function onMqttConnect() {
  mqttConnected = true;
  mqttClient.subscribe(['mirror/status', 'mirror/preview', 'mirror/prompts']);
  setTransport('MQTT');
  clearInterval(snapTimer); // MQTT preview replaces HTTP snapshots
}

function onMqttError(err) {
  console.log('[MQTT] error:', err.message);
  // silently fall back to HTTP
}

function onMqttClose() {
  mqttConnected = false;
  setTransport('HTTP');
  startSnapshots();
}

function onMqttMessage(topic, msg) {
  try {
    const payload = JSON.parse(msg.toString());
    if (topic === 'mirror/status')  handleStatus(payload);
    if (topic === 'mirror/preview') handlePreview(payload);
    if (topic === 'mirror/prompts') handlePromptsPayload(payload);
  } catch(e) {}
}

// ---------------------------------------------------------------- HTTP poll
function startHttpPoll() {
  clearInterval(pollTimer);
  pollTimer = setInterval(httpPoll, POLL_INTERVAL);
  httpPoll();
}
function startSnapshots() {
  clearInterval(snapTimer);
  snapTimer = setInterval(fetchSnapshot, SNAPSHOT_INTERVAL);
}
function clearTimers() {
  clearInterval(pollTimer);
  clearInterval(snapTimer);
}

async function httpPoll() {
  try {
    const d = await fetchApi('/api/status');
    handleStatus(d);
  } catch(e) {
    handleStatus(null);
  }
}

async function fetchSnapshot() {
  if (mqttConnected) return;
  try {
    const d = await fetchApi('/api/snapshot');
    if (d.data) showPreviewData(d.data, Date.now());
  } catch(e) {}
}

// ---------------------------------------------------------------- status
function handleStatus(data) {
  if (!data) {
    mirrorOnline = false;
    connBadge.className = 'badge badge-offline';
    connText.textContent = 'Offline';
    stateBadge.textContent = '—';
    allCtrlBtns.forEach(b => { if(b) b.disabled = true; });
    scrollSpeedInput.disabled = true;
    return;
  }
  mirrorOnline = true;
  connBadge.className = 'badge badge-online';
  connText.textContent = 'Online';
  if (data.state) stateBadge.textContent = data.state;
  allCtrlBtns.forEach(b => { if(b) b.disabled = false; });
  scrollSpeedInput.disabled = false;

  if (!mqttConnected) startSnapshots();
}

function setTransport(type) {
  transportBadge.textContent = type;
  transportBadge.className = type === 'MQTT'
    ? 'badge badge-mqtt' : 'badge badge-http';
}

// ---------------------------------------------------------------- preview
function handlePreview(payload) {
  if (payload.data) showPreviewData(payload.data, payload.ts);
}
function showPreviewData(b64, ts) {
  livePreview.src = 'data:image/jpeg;base64,' + b64;
  livePreview.style.display = 'block';
  previewPlaceholder.style.display = 'none';
  const d = new Date(ts);
  previewTs.textContent = d.toLocaleTimeString();
}

// ---------------------------------------------------------------- prompts
async function loadPrompts() {
  try {
    const d = await fetchApi('/api/prompts');
    handlePromptsPayload(d, true);
  } catch(e) {}
}

function handlePromptsPayload(d, saveOriginals = false) {
  if (!d) return;
  if (d.MIRROR_PERSONA !== undefined) {
    document.getElementById('prompt-persona').value = d.MIRROR_PERSONA;
    if (saveOriginals && !localStorage.getItem('orig_MIRROR_PERSONA'))
      localStorage.setItem('orig_MIRROR_PERSONA', d.MIRROR_PERSONA);
  }
  if (d.AI_FALLBACK_MESSAGE !== undefined) {
    document.getElementById('prompt-fallback').value = d.AI_FALLBACK_MESSAGE;
    if (saveOriginals && !localStorage.getItem('orig_AI_FALLBACK_MESSAGE'))
      localStorage.setItem('orig_AI_FALLBACK_MESSAGE', d.AI_FALLBACK_MESSAGE);
  }
  if (d.BOOTH_AI_PROMPT_SYSTEM !== undefined) {
    document.getElementById('prompt-booth').value = d.BOOTH_AI_PROMPT_SYSTEM;
    if (saveOriginals && !localStorage.getItem('orig_BOOTH_AI_PROMPT_SYSTEM'))
      localStorage.setItem('orig_BOOTH_AI_PROMPT_SYSTEM', d.BOOTH_AI_PROMPT_SYSTEM);
  }
}

function restorePrompt(key) {
  const orig = localStorage.getItem('orig_' + key);
  if (!orig) return;
  const el = {
    MIRROR_PERSONA:         document.getElementById('prompt-persona'),
    AI_FALLBACK_MESSAGE:    document.getElementById('prompt-fallback'),
    BOOTH_AI_PROMPT_SYSTEM: document.getElementById('prompt-booth'),
  }[key];
  if (el) el.value = orig;
}

// ---------------------------------------------------------------- send command
function sendCmd(payload) {
  if (mqttConnected && mqttClient) {
    mqttClient.publish('mirror/cmd', JSON.stringify(payload));
    return Promise.resolve();
  }
  const pathMap = {
    trigger:    ['/api/trigger/short', 'POST'],
    photobooth: ['/api/trigger/long',  'POST'],
    power_on:   ['/api/power/on',      'POST'],
    power_off:  ['/api/power/off',     'POST'],
  };
  if (pathMap[payload.action]) {
    const [path, method] = pathMap[payload.action];
    return fetchApi(path, { method });
  }
  return Promise.resolve();
}

// ---------------------------------------------------------------- button handlers
document.getElementById('btn-trigger').addEventListener('click', () =>
  sendCmd({action:'trigger'}).catch(console.warn));

document.getElementById('btn-booth').addEventListener('click', () =>
  sendCmd({action:'photobooth'}).catch(console.warn));

document.getElementById('btn-power-on').addEventListener('click', () =>
  sendCmd({action:'power_on'}).catch(console.warn));

document.getElementById('btn-power-off').addEventListener('click', () =>
  sendCmd({action:'power_off'}).catch(console.warn));

document.getElementById('btn-send-text').addEventListener('click', async () => {
  const text = document.getElementById('overlay-text').value.trim();
  try {
    if (mqttConnected && mqttClient) {
      mqttClient.publish('mirror/cmd', JSON.stringify({action:'display_text', text}));
    } else {
      await fetchApi('/api/display/text', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text})
      });
    }
    showMsg(pushMsg, 'Text sent', 'ok');
  } catch(e) { showMsg(pushMsg, e.message, 'error'); }
});

document.getElementById('btn-clear-overlay').addEventListener('click', async () => {
  try {
    if (mqttConnected && mqttClient) {
      mqttClient.publish('mirror/cmd', JSON.stringify({action:'clear_overlay'}));
    } else {
      await fetchApi('/api/display', {method:'DELETE'});
    }
    showMsg(pushMsg, 'Cleared', 'ok');
  } catch(e) { showMsg(pushMsg, e.message, 'error'); }
});

// image file
let imgB64 = null;
document.getElementById('img-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    imgB64 = ev.target.result.split(',')[1];
    const preview = document.getElementById('img-preview');
    preview.src = ev.target.result;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

document.getElementById('btn-send-image').addEventListener('click', async () => {
  if (!imgB64) return;
  try {
    if (mqttConnected && mqttClient) {
      mqttClient.publish('mirror/cmd', JSON.stringify({action:'display_image', data:imgB64}));
    } else {
      await fetchApi('/api/display/image', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({data: imgB64})
      });
    }
    showMsg(pushMsg, 'Image sent', 'ok');
  } catch(e) { showMsg(pushMsg, e.message, 'error'); }
});

document.getElementById('btn-save-prompts').addEventListener('click', async () => {
  const prompts = {
    MIRROR_PERSONA:         document.getElementById('prompt-persona').value,
    AI_FALLBACK_MESSAGE:    document.getElementById('prompt-fallback').value,
    BOOTH_AI_PROMPT_SYSTEM: document.getElementById('prompt-booth').value,
  };
  try {
    if (mqttConnected && mqttClient) {
      mqttClient.publish('mirror/cmd', JSON.stringify({action:'update_prompts', ...prompts}));
    } else {
      await fetchApi('/api/prompts', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(prompts)
      });
    }
    showMsg(promptsMsg, 'Saved', 'ok');
  } catch(e) { showMsg(promptsMsg, e.message, 'error'); }
});

document.getElementById('btn-save-settings').addEventListener('click', async () => {
  const speed = parseInt(scrollSpeedInput.value);
  try {
    await fetchApi('/api/config', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({MESSAGE_SCROLL_SPEED: speed})
    });
  } catch(e) { console.warn(e); }
});

// ---------------------------------------------------------------- helpers
function showMsg(el, msg, type) {
  el.textContent = msg;
  el.className = 'status-msg ' + type;
  setTimeout(() => { el.textContent = ''; el.className = 'status-msg'; }, 3000);
}
</script>
</body>
</html>
