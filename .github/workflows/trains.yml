name: Trains timetable
on:
  schedule:
    - cron: "23 4 * * 2,5"          # Tue and Fri, 05:23 in Zürich in winter (the feed changes Mon and Thu)
    - cron: "53 7 * * 2,5"          # a second try: GitHub sometimes skips scheduled runs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trains
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q numpy
      - name: Build the timetable and the schematic
        env:
          TZ: Europe/Zurich                 # "today" is Zürich's date
        run: python3 tools/build_trains.py --skip-if-current
      - name: Publish
        run: |
          git config user.name fortuna-wall
          git config user.email wall@users.noreply.github.com
          git add assets/trains
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Trains: timetable from $(date +%F)"
          git pull --rebase --autostash -q origin master
          git push -q origin HEAD:master
