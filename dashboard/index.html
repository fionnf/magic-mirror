<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Mirror Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.8rem;
            color: #333;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }
        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        .status-badge.online .status-dot {
            background: #28a745;
        }
        .status-badge.offline .status-dot {
            background: #dc3545;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .config-panel {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .config-panel label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }
        .config-panel input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }
        .config-panel input:focus {
            outline: none;
            border-color: #667eea;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            color: #333;
        }
        .button-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 100px;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-success {
            background: #28a745;
            color: white;
        }
        .btn-success:hover {
            background: #218838;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .gallery-item {
            aspect-ratio: 16 / 10;
            border-radius: 8px;
            overflow: hidden;
            background: #eee;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-item:hover {
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .state-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e7f3ff;
            color: #0066cc;
            margin-top: 0.5rem;
        }
        .error {
            color: #dc3545;
            padding: 0.75rem;
            background: #f8d7da;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Magic Mirror Control</h1>
            <div class="status-badge offline" id="status">
                <span class="status-dot"></span>
                <span id="status-text">Offline</span>
            </div>
        </header>

        <div class="config-panel">
            <label for="pi-ip">Mirror IP Address (local network)</label>
            <input
                type="text"
                id="pi-ip"
                placeholder="e.g., 192.168.1.100:5000"
                value="localhost:5000"
            >
            <div class="error" id="error-message"></div>
        </div>

        <div class="grid">
            <!-- Control Panel -->
            <div class="card">
                <h2>Control</h2>
                <div class="button-group">
                    <button class="btn-primary" id="trigger-short" disabled>
                        🎬 Trigger
                    </button>
                    <button class="btn-secondary" id="trigger-long" disabled>
                        📷 Photobooth
                    </button>
                </div>
                <div style="margin-top: 1.5rem;">
                    <p style="color: #666; margin-bottom: 0.75rem;">Power</p>
                    <div class="button-group">
                        <button class="btn-success" id="power-on" disabled>
                            Power On
                        </button>
                        <button class="btn-danger" id="power-off" disabled>
                            Power Off
                        </button>
                    </div>
                </div>
                <div id="state-info" style="margin-top: 1rem;"></div>
            </div>

            <!-- Settings -->
            <div class="card">
                <h2>Settings</h2>
                <label for="scroll-speed">Scroll Speed (px/s)</label>
                <input
                    type="number"
                    id="scroll-speed"
                    min="10"
                    max="100"
                    value="40"
                    disabled
                >
                <button class="btn-primary" id="save-settings" style="width: 100%; margin-top: 1rem;" disabled>
                    Save Settings
                </button>
            </div>
        </div>

        <!-- Gallery -->
        <div class="card">
            <h2>Recent Photos</h2>
            <div class="gallery" id="gallery">
                <p style="color: #999;">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        const API_TIMEOUT = 5000;
        const STATUS_POLL_INTERVAL = 2000;

        const piIpInput = document.getElementById('pi-ip');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const stateInfo = document.getElementById('state-info');
        const errorMsg = document.getElementById('error-message');

        const triggerShortBtn = document.getElementById('trigger-short');
        const triggerLongBtn = document.getElementById('trigger-long');
        const powerOnBtn = document.getElementById('power-on');
        const powerOffBtn = document.getElementById('power-off');
        const saveSettingsBtn = document.getElementById('save-settings');
        const scrollSpeedInput = document.getElementById('scroll-speed');
        const gallery = document.getElementById('gallery');

        // Load saved IP
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('mirror-ip');
            if (saved) {
                piIpInput.value = saved;
            }
            startStatusPoll();
        });

        piIpInput.addEventListener('change', (e) => {
            localStorage.setItem('mirror-ip', e.target.value);
            startStatusPoll();
        });

        async function getApiUrl() {
            let ip = piIpInput.value.trim();
            if (!ip) return null;
            if (!ip.includes(':')) ip += ':5000';
            if (!ip.startsWith('http')) ip = 'http://' + ip;
            return ip;
        }

        async function fetchApi(endpoint, options = {}) {
            const url = await getApiUrl();
            if (!url) {
                throw new Error('No mirror IP configured');
            }
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), API_TIMEOUT);
            try {
                const res = await fetch(`${url}${endpoint}`, {
                    ...options,
                    signal: controller.signal,
                });
                clearTimeout(timeout);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.json();
            } catch (e) {
                clearTimeout(timeout);
                throw e;
            }
        }

        function setError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.toggle('show', !!msg);
        }

        function setStatus(online, state) {
            statusEl.className = `status-badge ${online ? 'online' : 'offline'}`;
            statusText.textContent = online ? 'Online' : 'Offline';

            const buttons = [triggerShortBtn, triggerLongBtn, powerOnBtn, powerOffBtn, saveSettingsBtn, scrollSpeedInput];
            buttons.forEach(btn => btn.disabled = !online);

            if (online && state) {
                stateInfo.innerHTML = `<div class="state-badge">${state}</div>`;
            } else {
                stateInfo.innerHTML = '';
            }
        }

        async function pollStatus() {
            try {
                const data = await fetchApi('/api/status');
                setStatus(true, data.state);
                setError('');
            } catch (e) {
                setStatus(false, null);
                setError(`Mirror offline: ${e.message}`);
            }
        }

        function startStatusPoll() {
            pollStatus();
            setInterval(pollStatus, STATUS_POLL_INTERVAL);
        }

        triggerShortBtn.addEventListener('click', async () => {
            try {
                await fetchApi('/api/trigger/short', { method: 'POST' });
                setError('');
            } catch (e) {
                setError(`Trigger failed: ${e.message}`);
            }
        });

        triggerLongBtn.addEventListener('click', async () => {
            try {
                await fetchApi('/api/trigger/long', { method: 'POST' });
                setError('');
            } catch (e) {
                setError(`Trigger failed: ${e.message}`);
            }
        });

        powerOnBtn.addEventListener('click', async () => {
            try {
                await fetchApi('/api/power/on', { method: 'POST' });
                setError('');
            } catch (e) {
                setError(`Power on failed: ${e.message}`);
            }
        });

        powerOffBtn.addEventListener('click', async () => {
            try {
                await fetchApi('/api/power/off', { method: 'POST' });
                setError('');
            } catch (e) {
                setError(`Power off failed: ${e.message}`);
            }
        });

        saveSettingsBtn.addEventListener('click', async () => {
            try {
                await fetchApi('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        MESSAGE_SCROLL_SPEED: parseInt(scrollSpeedInput.value)
                    })
                });
                setError('');
            } catch (e) {
                setError(`Save failed: ${e.message}`);
            }
        });
    </script>
</body>
</html>
